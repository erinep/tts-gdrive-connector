  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      padding: 2px;
      padding-bottom: 3em;
    }

    p {
      padding: 0;
      margin: 0;
    }

    .context,
    textarea,
    select,
    audio,
    button {
      margin-top: 2px;
      margin-bottom: 2px;
      padding: 5px;
      font-size: 13px;
    }

    .context {
      /* background: #eee;
      border: 1px solid #ccc;
      padding: 8px;
      white-space: pre-wrap; */
      max-height: 200px;    /* restrict height */
      overflow-y: auto;     /* vertical scrollbar if content too tall */
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #f9f9f9;
      border-radius: 5px;
    }


    button {
      padding: 3px;
      margin: 3px;
      max-width: 100px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;    
    }

    button:hover {
      background-color: #77d77b;
    }

    summary {
      font-size: 1.2em;
      font-weight: bold;
      color: #2c3e50; /* dark blue/gray */
      border-bottom: 2px solid #ddd;
      margin-top: 5px;
      margin-bottom: 5px;
      padding: 0;
    }

    textarea {
      width: 100%;
      max-width: 300px;
      height: 100px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical; /* allow vertical resizing only */
      box-sizing: border-box;
    }

    select, option {
      width: 100%;
      border-radius: 4px;
      border: 1px solid #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
  }

  audio {
    width: 100%;
    height: 35px;
    max-width: 300px;
    display: block;
  }

    .loading {
      font-style: italic;
      color: #888;
    }

  #status {
    border-top: 2px solid #ccc; 
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    background: white;
    padding: 0.2em;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
  }

  </style>

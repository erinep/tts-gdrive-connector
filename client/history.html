<script>

  document.getElementById("session-id-input").addEventListener("keydown", (event) =>{
    if (event.key === 'Enter') {
      searchHistory();
    }
  });


  function updateHistoryUI(details) {
    const div = document.getElementById("histDiv");

    let links = false;
    let buttons = true;

    if (links) {
      const anchor = document.createElement("a");
      anchor.classList.add("historyLink");
      anchor.target = "_blank";
      anchor.href = details.file_url;
      anchor.innerText = details.file_name;
      div.appendChild(anchor);

    } else if (buttons){

      // Set Text for the button
      voice = details.voiceName.replace(/ /g, "_").replace(/-/g, "");
      const buttonText = `${voice.substring(0,7)}_${details.sessionId.substring(17,22)}`;
      
      const button = document.createElement("button");
      button.classList.add("hist-btn");
      button.innerText = buttonText;
      button.onclick = () => loadHistory(details.sessionId);
      div.appendChild(button);

    }
  }

  function sanitizeId(id) {
    //session id must of format 'session_YY-MM-DD_HH:MM:ss'
    if (typeof id !== 'string' || !/^session_\d{2}-\d{2}-\d{2}_\d{2}:\d{2}:\d{2}$/.test(id)) {
      throw new Error('Invalid ID format: Only letters, numbers, - and _ are allowed.');
    }
    return id;
  }

  function searchHistory() {
    const search = document.getElementById("session-id-input").value.trim();
    loadHistory(search);
  }

  async function loadHistory (id){

    if (!id) throw new Error('Session ID is required');
    sanitizeId(id);
    blockAudioUI();
    fetchSessionAudio(id).then( audioChunks => {
      loadAudioChunks(audioChunks);
      unblockAudioUI();
    }).catch(e => {
      showStatus(e.message, true);
      unblockAudioUI();
    })
  }

  function fetchSessionAudio (id) {
    return new Promise ((resolve, reject) => {
      google.script.run
        .withSuccessHandler(d => {
          resolve(d);
        }).withFailureHandler(e => {

          showStatus(e.message, true);
          reject(new Error(e.message));
        
        }).getSession(id);
    })
  }

</script>

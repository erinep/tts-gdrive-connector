<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('client/stylesheet'); ?>
</head>
<body>
  <div id="controls">
  <details>
    <summary>Text To Speech</summary>
    <button onclick="updateContext()">Update Text</button><br>
    <div id="selectedBox" class="context"><span class="loading">Loading...</span></div>
    <select id="voiceList"><option value="" disabled selected hidden>Select a voice </option></select>
    <div>Credits: <span style="color:grey" id="creditCount"></span></div>
      <!-- <div>Heading: <span style="color:grey" id="headingName"></span></div> -->


    <div>
      <button id="ttsTriggerBtn" onclick="callTTS()">Build Speech!</button>
      <button onclick="addToCue()">Add to Cue</button>
    </div>
    <audio id="audioPlayer" controls>
      <source id="audioSource" src="" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </details>
  <!-- <details>
    <summary>playback</summary>
    <div style="color:red">Not Implemented</div>
  </details> -->
  <details> 
    <summary>API Manager</summary>

    <select id="api-selector" onchange="loadTTSService(event)">
      <option value="1">Eleven Labs API</option>
      <option value="2">Google TTS API</option>
    </select>

    <div id="google-block" hidden>
      <p style="color:grey; font-family: italic">Input a Google token with access to <i>Cloud Text-to-Speech API</i></p>

    </div>
    <div id="el-block" hidden>
      <p style="color:grey; font-family: italic">Input your ElevenLabs API Token here. Permissions: <i>Text to Speech, User (read), Voices (read)</i></p>
    </div>

    <div>
      <button type="button" onclick="saveKey()">Update Key</button>
      <button type="button" onclick="fetchUserDetails()">Test</button>
    </div>
    <textarea id="apikey" type="password" placeholder="update your key" style="width:100%"></textarea><br />
    <div id="userDetails">
      <p>API KEY: <span id="statusCircle" value="untested" style="color:grey;"/> </p>
    </div>
  </details>
  </div>
  <div id="status"></div>

  <?!= include('client/javascript'); ?>
</body>
</html>

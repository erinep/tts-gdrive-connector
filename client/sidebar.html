<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('client/stylesheet'); ?>
</head>
<body>
  <details>
    <summary>Load Text</summary>
    <button onclick="updateContext()">Update Text</button>
    <div class="content" id="selectedBox" ><span class="loading">Loading...</span></div>
    <div class="form-row"> <label>Characters: </label><i style="color:grey; margin: 0;" id="charCount"></i></div>
  </details>
    <!-- <div>Heading: <span style="color:grey" id="headingName"></span></div> -->
    
  <details>
    <summary>Configure Voice</summary>
    <div class="form-row" >
      <label>TTS Service:</label>  
      <select id="api-selector" onchange="loadTTSService(event)">
        <option value="eleven_labs">Eleven Labs API</option>
        <option value="google-tts">Google TTS API</option>
      </select>
    </div>
    <div class="form-row google-block hidden">
      <label>Accent:</label>
      <select id="accent">
        <option default value="en-US">American</option>
        <option value="en-GB">British</option>
        <option value="en-AU">Australian</option>
      </select>
    </div>
    <div class="form-row">
      <label>Voice:</label>
      <select id="voiceList"><option value="" disabled selected hidden>Select a voice </option></select>
      <p class="google-block hidden"><i style="font-size: xx-small; color:rgb(175, 175, 175)">*Australian Studio voices not available</i></p>
    </div>
    <div class="form-row google-block hidden">
      <label for="readingSpeedInput">Speed: <span id="readingSpeed">1</span></label></br>
      <input 
        id="readingSpeedInput" 
        value="1" 
        type="range" 
        min="0.25" 
        max="2" 
        step="0.05"
        oninput= "document.getElementById('readingSpeed').textContent = this.value"
      >
    </div>
    <!-- PITCH NOT SUPPORTED FOR THESE VOICES -->
    <!-- <div class="form-row hidden">
      <label for="readingPitchInput">Pitch: <span id="readingPitch">0</span></label></br>
      <input 
        id="readingPitchInput" 
        value="0" 
        type="range" 
        min="-20" 
        max="20" 
        step="0.5"
        oninput= "document.getElementById('readingPitch').textContent = this.value"
      > -->
    </div>
    <div class="form-row el-block hidden" style="margin-top:5px;">
      <label>Model: </label>
      <span style="color:grey; width:fit-content;"><i>Turbo V2</i></span>
    </div>
    <button id="ttsTriggerBtn" onclick="callTTS()">Submit</button>
  </details>

  <details>
    <summary>Audio Player</summary>
    <audio id="audioPlayer" controls>
      <source id="audioSource" src="" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>
  </details>

  <details>
    <summary>API Manager</summary>
    <p class="google-block hidden" style="color:grey; font-family: italic">Input a Google token with access to <i>Cloud Text-to-Speech API</i></p>
    <p class="el-block hidden" style="color:grey; font-family: italic">Input your ElevenLabs API Token here. Permissions: <i>Text to Speech</i></p>
    <textarea id="apikey" type="password" placeholder="update your key" style="width:100%"></textarea><br />
    <button type="button" onclick="saveKey()">Update Key</button>
  </details>

  <div id="status"></div>

  <?!= include('client/javascript'); ?>
</body>
</html>

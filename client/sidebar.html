<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('client/stylesheet'); ?>
</head>
<body>
  <details class="menu-block" open>
    <summary>Text Preview</summary>
      <div class="toolbar-buttons">
  <button class="toolbar-btn" type="button" title="Get Current Paragraph" onclick="getDocText('getCurrentParagraphText')">
    Paragraph
  </button>
  <button class="toolbar-btn" type="button" title="Get Selected Text" onclick="getDocText('getSelectedText')">
    Selected
  </button>
  <button class="toolbar-btn" type="button" title="Get Up to 5000 Characters" onclick="getDocText('getParagraphsUpToX')">
    Batch
  </button>
</div>
    <div class="content" ><span id="selectedBox"></span></div>
    <div class="form-row">
      <label>Characters: </label>
      <i style="color:grey; margin: 0;" id="charCount"></i>
    </div>
    <button id="ttsTriggerBtn" class="btn" onclick="callTTS()">Submit</button>
    <!-- <audio id="audioPlayer" controls>
      <source id="audioSource" src="" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio> -->
    <div id="chunkControls" class="toolbar-buttons">
      <button id="prevChunkBtn" onClick="prevChunk()" class="toolbar-btn">⏮️</button>
      <button id="PlayAllChunks" onClick="pausePlayChunks()" class="toolbar-btn">⏯️</button>
      <button id="PlayAllChunks" onClick="stopChunks()" class="toolbar-btn">⏹️</button>
      <button id="PlayAllChunks" onClick="restartActiveChunks()" class="toolbar-btn">🔄</button>
      <button id="nextChunkBtn" onClick="nextChunk()" class="toolbar-btn">⏭️</button>
    </div>
    <p id="previewChunk"class="content">test!</p>
  </details>

  <details class="menu-block">
    <summary>Configure Voice</summary>
    <div class="form-row google-block hidden">
      <label>Accent:</label>
      <select id="accent">
        <option default value="en-US">American</option>
        <option value="en-GB">British</option>
        <option value="en-AU">Australian</option>
      </select>
    </div>
    <div class="form-row">
      <label>Voice:</label>
      <select id="voiceList"><option value="" disabled selected hidden>Select a voice </option></select>
    </div>
    <div class="form-row google-block hidden">
      <label for="readingSpeedInput">Speed: <span id="readingSpeed">1</span></label></br>
      <input 
        id="readingSpeedInput" 
        value="1" 
        type="range" 
        min="0.25" 
        max="2" 
        step="0.05"
        oninput= "document.getElementById('readingSpeed').textContent = this.value"
      >
    </div>
    <div class="form-row el-block hidden" style="margin-top:5px;">
      <label>Model: </label>
      <span style="color:grey; width:fit-content;"><i>Turbo V2</i></span>
    </div>
  </details>

  <details class="menu-block" open>
    <summary>History</summary>
    <div id="histDiv">
      <!-- <a id="driveLink" target="_blank"></a> -->
      <!-- RECORDING HISTORY WILL BE ADDED HERE -->
    </div>
  </details>

  <details class="menu-block">
    <summary>Settings</summary>
    <div class="form-row" >
      <label>TTS Service:</label>  
      <select id="api-selector" onchange="loadTTSService(event)">
        <option value="eleven_labs">Eleven Labs</option>
        <option value="google-tts">Google Text-To-Speech</option>
      </select>
    </div>
    <div class="google-block hidden">
      <label for="showStudio">Include Studio Voices?</label>
      <input id="showStudio" onchange="getVoices()" type="checkbox" style="width: fit-content">
      <p class="google-block hidden">Studio voices only available for American and British Accents</p>
    </div>
    <label for="apikey">API setup:</label>
    <p class="google-block hidden">Input a Google token with access to <i>Cloud Text-to-Speech API</i></p>
    <p class="el-block hidden">Input your ElevenLabs API Token here. Permissions: <i>Text to Speech</i></p>
    <textarea id="apikey" type="password" placeholder="update your key"></textarea><br />
    <button type="button" class="btn" onclick="saveKey()">Update Key</button>
    <!-- <button type="button" onclick="testConnection()">Test</button> -->
    <button type="button" class="btn" onclick="showStatus()">Clear Status Msg</button>
  </details>

  <div id="status"></div>

  <?!= include('client/javascript'); ?>
  <?!= include('client/audio'); ?>
</body>
</html>

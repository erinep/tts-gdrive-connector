<script>

  function saveKey() {
    const keyEl = document.getElementById('apikey');
    const key = keyEl.value.trim();
    if (!key) {
      showStatus('Key empty', true);
      return;
    }
    google.script.run
      .withSuccessHandler(msg => {
        keyEl.value = "";
        showStatus(msg)
      })
      .withFailureHandler(e => showStatus(e.message, true))
      .setApiKeyForUser(key);
  }

  function getVoices() {
    const dropdown  = document.getElementById('voiceList');
    const isStudioInVoiceList = document.getElementById('showStudio').checked;
    dropdown.innerHTML = null;

    google.script.run
      .withSuccessHandler( res => {

        console.log(res);
        // Build Voice Option list
        Object.entries(res.voices).forEach(([groupName,voices]) => {
          let optgroup = document.createElement("optgroup");
          optgroup.label = groupName
          voices.forEach( voice => {
            let option = document.createElement('option');
            option.text = voice?.name || voice;
            option.value = voice?.id || voice;
            optgroup.appendChild(option);
          })
          dropdown.appendChild(optgroup); 
        });
        showStatus(res.message, false);
      })
      .withFailureHandler( e => showStatus(e.message, true))
      .getAIVoiceList(isStudioInVoiceList)
  }
  
  async function callTTS() {
    try {
      toggleBtnDisabled(true);

      await setUserInputs();
      const packet = await fetchAudio();
      const audioChunks= packet.audioChunks;

      loadAudioChunks(audioChunks);

      showStatus("Storing audio...");
      const driveDetails = await storeAudio(audioChunks);

      updateHistoryUI(driveDetails);

      showStatus(driveDetails.message);
    } catch (err) {
      showStatus(err.message, true);
    } finally {
      toggleBtnDisabled(false);
    }
  }

  async function setUserInputs(){
    const inputs = getUserInputsFromDOM();

    return new Promise( (resolve, reject) => {
       google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(e => {
          showStatus(e.message, true);
          reject(e);
        })
        .setInputData(inputs);
    });
  }

  function getUserInputsFromDOM() {
    return {
      text: document.getElementById("selectedBox").innerText,
      voice: document.getElementById("voiceList").value,
      locale: document.getElementById("accent")?.value,
      speed: document.getElementById("readingSpeedInput")?.value
    };
  }

  function toggleBtnDisabled(isDisabled) {
    const btn = document.getElementById("ttsTriggerBtn");
    if (isDisabled) btn.setAttribute("disabled", "disabled");
    else btn.removeAttribute("disabled");
  }

  function fetchAudio(text, voice, locale, speed) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .fetchAudio();
    });
  }



  function storeAudio(audioChunks) {
    const metaData = { voice: audioChunks[0]?.voice || "unknown" };

    return new Promise((resolve, reject) => {
      const div = document.getElementById("histDiv");
      div.classList.add("loading");

      google.script.run
        .withSuccessHandler(details => {
          div.classList.remove("loading");
          resolve(details);
        })
        .withFailureHandler(msg => {
          div.classList.remove("loading");
          reject(new Error(msg));
        })
        .audioStorageHandler(audioChunks, "gcs");
    });
  }

  function updateHistoryUI(details) {
    const div = document.getElementById("histDiv");
    const anchor = document.createElement("a");
    anchor.classList.add("historyLink");
    anchor.target = "_blank";
    anchor.href = details.file_url;
    anchor.innerText = details.file_name;
    div.appendChild(anchor);
  }

  function addToCue() {
    showStatus("Not Implemented", true);
    return;
  }

  function showStatus(msg, isError) {
    const el = document.getElementById('statusText');
    el.textContent = msg || "";
    el.style.color = isError ? 'red' : 'green';
  }

  function loadTTSService(e) {
    const value = e?.target?.value;

    // Load Menu with perset Value if none were given
    if (!value) {
      google.script.run
      .withFailureHandler(e => showStatus(e.message, true))
      .withSuccessHandler(oldValue => {
        controllerPageUpdate(oldValue);
      }).getCurrentService();
    } else {
      // Load Menu with the selected Value
      google.script.run
      .withSuccessHandler( () => {
        controllerPageUpdate(value);
      }).withFailureHandler( er => showStatus(er.message , true))
      .setCurrentService(value);
    }
  }

function controllerPageUpdate (value ){
  const googleElements = document.querySelectorAll('.google-block');
  const elevenElements = document.querySelectorAll('.el-block');
  const selector = document.getElementById("api-selector");
  selector.value = value;

  // Update Voice list based on current service
  getVoices();

  // update menu items
  if(value === "eleven_labs") {
    googleElements.forEach(el => el.classList.add('hidden'));
    elevenElements.forEach(el => el.classList.remove('hidden'));
  } else if (value === "google-tts") {
    elevenElements.forEach(el => el.classList.add('hidden'));
    googleElements.forEach(el => el.classList.remove('hidden'));
  } else {
    showStatus("service ID not found: "+ value, true);
  }
}

  function getDocText(serverFunctionName) {
    const selectionEl = document.getElementById('selectedBox');
    const countEl = document.getElementById('charCount');
    selectionEl.classList.remove("text-error");
    selectionEl.innerText = "";
    selectionEl.classList.add("loading");
    countEl.innerText = "";
    countEl.classList.add("loading");

    google.script.run
      .withSuccessHandler(function(content) {
        selectionEl.innerText = content;
        countEl.innerText = content.length;
        selectionEl.classList.remove("loading");
        countEl.classList.remove("loading");
      })
      .withFailureHandler(e => {
        countEl.classList.remove("loading");
        selectionEl.classList.remove("loading");
        selectionEl.classList.add("text-error");
        selectionEl.innerText = e.message;
        countEl.innerText = "";
      })[serverFunctionName]();
  }

  loadTTSService();
  getDocText('getCurrentParagraphText');
</script>

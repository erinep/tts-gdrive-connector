<script>
  let audioPlayers = [];
  let activePlayerIndex = null;
  let preview = document.getElementById("previewChunk");

  function loadAudioChunks(audioChunks) {
    if (!audioChunks || audioChunks.length === 0) {
      showStatus("No audio chunks available", true);
      return;
    }

    audioPlayers = []; // Reset audio players
    audioPlayers = audioChunks.map(chunk => {
      const audio = new Audio(`data:${chunk.contentType};base64,${chunk.base64}`);
      audio._chunkText = chunk.text;
      return audio;
    });

    showStatus(`${audioPlayers.length} audio files loaded`);
  }
  
      // // If array, play first chunk (extend to play all sequentially later)
      // const chunk = Array.isArray(audioChunks) ? audioChunks[0] : audioChunks;


  function pausePlayChunks() {
    if (activePlayerIndex === null) {
      activePlayerIndex = 0;
    }
    if (activePlayerIndex < audioPlayers.length) {

      updatePreviewUI();
      if (audioPlayers[activePlayerIndex].paused) {
        audioPlayers[activePlayerIndex].play();
      } else {
        audioPlayers[activePlayerIndex].pause();
      }

    } else {
      showStatus("No audio loaded to play", true);
    }
  }

  function restartActiveChunks() {
    if (activePlayerIndex !== null && audioPlayers[activePlayerIndex]) {
      audioPlayers[activePlayerIndex].currentTime = 0;
    } else {
      showStatus("No audio is currently playing", true);
    }
  }

  function stopChunks() {
    if (activePlayerIndex !== null && audioPlayers[activePlayerIndex]) {
      audioPlayers[activePlayerIndex].pause();
      audioPlayers[activePlayerIndex].currentTime = 0;
      
      // Reset to the beginning
      activePlayerIndex = 0;
      updatePreviewUI();
    } else {
      showStatus("No audio is currently playing", true);
    }
  }

  function nextChunk() {
    if (activePlayerIndex !== null && activePlayerIndex < audioPlayers.length - 1) {
      audioPlayers[activePlayerIndex].pause();
      activePlayerIndex++;
      updatePreviewUI();
      audioPlayers[activePlayerIndex].currentTime = 0;
    } else {
      showStatus("No more chunks to play", true);
    }
  } 

  function prevChunk() {
    if (activePlayerIndex !== null && activePlayerIndex > 0) {
      audioPlayers[activePlayerIndex].pause();
      activePlayerIndex--;
      updatePreviewUI();
      audioPlayers[activePlayerIndex].currentTime = 0;
    } else {
      showStatus("No previous chunk to play", true);
    }
  }

  function updatePreviewUI() {
    preview.textContent = audioPlayers[activePlayerIndex]._chunkText;;
  }

</script>

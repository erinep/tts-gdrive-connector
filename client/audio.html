<script>
  let audioPlayers = [];
  let activePlayerIndex = null;
  let preview = document.getElementById("previewChunk");
  let progressBar = document.getElementById("progressBar");
  let currentTimeLabel = document.getElementById("currentTime");
  const totalTimeLabel = document.getElementById("totalTime");
  let activeChunkLabel = document.getElementById("activeChunk");

  function loadAudioChunks(audioChunks) {
    if (!audioChunks || audioChunks.length === 0) {
      showStatus("No audio chunks available", true);
      return;
    }

    audioPlayers = []; // Reset audio players
    activePlayerIndex = 0; // Reset active player index
    audioPlayers = audioChunks.map(chunk => {
      const audio = new Audio(`data:${chunk.contentType};base64,${chunk.base64}`);
      audio._chunkText = chunk.text;

      // AutoPlay next chunk when current on ends
      audio.onended = () => {
        if (activePlayerIndex < audioPlayers.length - 1) {
          activePlayerIndex++;
          loadAudioUI();
          audioPlayers[activePlayerIndex].play();
        } else {
          showStatus("All chunks played");
        }
      };
      return audio;
    });

    loadAudioUI();
    showStatus(`${audioPlayers.length} audio files loaded`);
  }
  
      // // If array, play first chunk (extend to play all sequentially later)
      // const chunk = Array.isArray(audioChunks) ? audioChunks[0] : audioChunks;


  function pausePlayChunks() {

    if (activePlayerIndex < audioPlayers.length) {

      loadAudioUI();
      if (audioPlayers[activePlayerIndex].paused) {
        audioPlayers[activePlayerIndex].play();
      } else {
        audioPlayers[activePlayerIndex].pause();
      }

    } else {
      showStatus("No audio loaded to play", true);
    }
  }

  function restartActiveChunks() {
    if (audioPlayers[activePlayerIndex]) {
      audioPlayers[activePlayerIndex].currentTime = 0;
    } else {
      showStatus("No audio is currently playing", true);
    }
  }

  function stopChunks() {
    if (audioPlayers[activePlayerIndex]) {
      audioPlayers[activePlayerIndex].pause();
      audioPlayers[activePlayerIndex].currentTime = 0;
      
      // Reset to the beginning
      activePlayerIndex = 0;
      loadAudioUI();
    } else {
      showStatus("No audio is currently playing", true);
    }
  }

  function nextChunk() {
    if (activePlayerIndex < audioPlayers.length - 1) {
      audioPlayers[activePlayerIndex].pause();
      activePlayerIndex++;
      loadAudioUI();
      audioPlayers[activePlayerIndex].currentTime = 0;
    } else {
      showStatus("No more chunks to play", true);
    }
  } 

  function prevChunk() {
    if (activePlayerIndex > 0) {
      audioPlayers[activePlayerIndex].pause();
      activePlayerIndex--;
      loadAudioUI();
      audioPlayers[activePlayerIndex].currentTime = 0;
    } else {
      showStatus("No previous chunk to play", true);
    }
  }

  function loadAudioProgressBar(audio) {

    if (!audio.duration){
      audio.onloadedmetadata = () => {
        progressBar.max = audio.duration;
        totalTimeLabel.textContent = formatTime(audio.duration);
      };
    } else {
      progressBar.max = audio.duration;
      totalTimeLabel.textContent = formatTime(audio.duration);
    }

    audio.addEventListener("timeupdate", () => {
      progressBar.value = audio.currentTime;
      currentTimeLabel.textContent = formatTime(audio.currentTime);
    });

    progressBar.addEventListener("input", () => {
      audio.currentTime = progressBar.value;
    });
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    const ms = Math.floor((sec % 1) * 1000);
    return `${m}:${s.toString().padStart(2,'0')}.${ms.toString().substring(0,2)}`;
  }

  function loadAudioUI() {
    preview.textContent = audioPlayers[activePlayerIndex]._chunkText;
    activeChunkLabel.textContent = `Chunk ${activePlayerIndex + 1} of ${audioPlayers.length}`;
    loadAudioProgressBar(audioPlayers[activePlayerIndex]);
  }

</script>
